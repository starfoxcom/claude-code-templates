# On-demand deep review
# Filters on body SIGNATURE (`@claude review this PR`), not author. Mirrors
# Emberholm's proven shape: the routine review's structured trigger comment
# (claude-code-review.yml Step 4.B) is posted by GITHUB_TOKEN — author =
# `claude[bot]`. So is the action's own progress comment. Body content
# distinguishes the two cleanly:
#   • Trigger comment body STARTS with `@claude review this PR — depth pass`.
#   • Progress comment body is `Claude Code is working…` and contains
#     `@claude` only inside backticks — never the literal substring
#     `@claude review this PR`.
#
# Merge gate participation: this workflow PATCHes the `Claude On-Demand`
# check-run on the PR HEAD SHA via the Checks API after Opus finishes its
# review. The check was created at status=in_progress by claude-code-review.yml's
# init-deep-check job; this workflow upgrades it to success/failure based on
# the deep verdict. Branch protection on main/develop requires both
# `Evaluate review outcome` (routine) AND `Claude On-Demand` (deep) — the
# two-check architecture replaces the prior fold-in-via-issue_comment gate
# whose check-runs failed to attach to the PR HEAD SHA. See the comment
# block in claude-code-review.yml for the historical rationale.
#
# Requires: CLAUDE_CODE_OAUTH_TOKEN in repo secrets.

name: Claude On-Demand

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    name: On-demand (@claude → deep review)
    # Filter: accept comments whose body contains `@claude review this PR`
    # AND does NOT contain `Claude Code is working`. Both conditions are
    # cheap string contains checks; defence-in-depth catches edge cases
    # like a future progress-comment template change that mentions both.
    #
    # Note for humans triggering manually: the body must contain the exact
    # phrase `@claude review this PR` (not just `@claude review`). Matches
    # the canonical structured trigger format documented in `_core/project-
    # template/.claude/rules/review-tiers.md`.
    # Anchor the bot-loop guard to startsWith — the action's progress comment
    # body STARTS with "Claude Code is working"; legitimate escalation
    # comments may quote the phrase when discussing the filter itself (e.g.
    # listing invariants for Opus to verify). Using `!contains` here would
    # reject any such quote and silently block the deep tier from firing.
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude review this PR') && !startsWith(github.event.comment.body, 'Claude Code is working')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude review this PR') && !startsWith(github.event.comment.body, 'Claude Code is working')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude review this PR') && !startsWith(github.event.review.body, 'Claude Code is working'))
    # CRITICAL: this MUST live at the job level (not workflow level). The
    # action's own progress comment ("Claude Code is working…") contains the
    # `@claude` substring, so workflow-level concurrency would accept it and
    # cancel the in-flight deep-tier review *before* the job-level `if:` had
    # a chance to filter it out. Job-level concurrency is evaluated AFTER
    # the job-level `if:`, so bot-comment runs that get filtered never enter
    # the concurrency group and can't preempt anything. The fallback to
    # `github.run_id` keeps the group unique for non-PR/issue events.
    concurrency:
      group: claude-on-demand-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
      # Needed to PATCH the `Claude On-Demand` check-run on the PR HEAD SHA
      # both at job start (in_progress) and after the Opus review completes
      # (success/failure based on verdict).
      checks: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # ── Resolve PR HEAD SHA once for downstream Checks API calls ──────────
      # claude.yml fires on issue_comment events, where the PR head SHA is
      # not directly in the event payload. Resolve it via the PR API and
      # expose it as a step output for the upsert + finalize steps.
      - name: Resolve PR HEAD SHA
        id: pr-head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.issue.number || github.event.pull_request.number }}"
          if [ -z "$PR_NUMBER" ]; then
            echo "::notice::Not on a PR — skipping HEAD SHA resolution"
            echo "head_sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.head.sha')
          if [ -z "$HEAD_SHA" ]; then
            echo "::error::Could not resolve HEAD SHA for PR $PR_NUMBER"
            exit 1
          fi
          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "head_sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "::notice::PR #$PR_NUMBER HEAD SHA = $HEAD_SHA"

      # ── Upsert Claude On-Demand check to in_progress ──────────────────────
      # claude-code-review.yml's init-deep-check job created the check at
      # status=in_progress; routine auto-escalation may have already PATCHed
      # the title to "Deep review in progress". For manual `@claude review
      # this PR` triggers without a prior routine run on this HEAD SHA, the
      # check may not yet exist — create it. Either way, the PR's check
      # rollup now shows "Claude On-Demand: in_progress" while Opus runs.
      - name: Upsert Claude On-Demand check to in_progress
        if: steps.pr-head.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ steps.pr-head.outputs.head_sha }}
        run: |
          REPO="${{ github.repository }}"
          CHECK_ID=$(gh api \
            "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=Claude%20On-Demand&per_page=100" \
            --jq '[.check_runs[] | select(.name == "Claude On-Demand")] | first | .id // empty')
          if [ -n "$CHECK_ID" ]; then
            gh api "repos/$REPO/check-runs/$CHECK_ID" -X PATCH \
              -F status="in_progress" \
              -F "output[title]=Deep review in progress" \
              -F "output[summary]=Opus is reviewing the PR. This check will be updated to success/failure when the Evaluate deep-tier verdict step parses the completion comment."
            echo "::notice::Set existing Claude On-Demand check $CHECK_ID to in_progress"
          else
            gh api "repos/$REPO/check-runs" -X POST \
              -F name="Claude On-Demand" \
              -F head_sha="$HEAD_SHA" \
              -F status="in_progress" \
              -F "output[title]=Deep review in progress" \
              -F "output[summary]=Manual @claude trigger fired on a HEAD SHA with no prior routine run. Opus is reviewing."
            echo "::notice::Created in_progress Claude On-Demand check on $HEAD_SHA"
          fi

      - name: Run Claude
        # Pinned to v1's resolved SHA (resolved 2026-05-04). The bare `@v1`
        # floats — silent behavior changes from auto-updates burned other
        # projects already. Update via
        #   curl -s "https://api.github.com/repos/anthropics/claude-code-action/git/refs/tags/v1" | jq -r '.object.sha'
        # and bump the SHA here AND in `.github/workflows/claude-code-review.yml`.
        uses: anthropics/claude-code-action@8c196b2f61a66bfdf93322bde3a3e668669089ed  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: '--allowedTools "Bash(gh *),Read" --max-turns 50 --model claude-opus-4-8'
          # Allow the routine review's `claude[bot]` to trigger this workflow.
          # The bare action defaults to "humans only" as a bot-loop safety;
          # we explicitly opt in to claude → claude because the routine tier
          # is the canonical caller for deep-review escalations per
          # `_core/project-template/.claude/rules/review-tiers.md`.
          allowed_bots: "claude"
          # NOTE on context: this action does NOT support a `system_prompt:`
          # input (warns "Unexpected input"). Project context is auto-loaded
          # by Claude Code itself from `CLAUDE.md` + `.claude/rules/*.md` at
          # repo root once the runner checks out. The structured `@claude`
          # comment from the routine review provides the per-PR focus,
          # invariants, and out-of-scope list, including the binary verdict
          # rule the deep tier must follow.

      - name: Evaluate deep-tier verdict
        # PATCH the `Claude On-Demand` check on the PR HEAD SHA to
        # success/failure based on Opus's verdict comment. Branch protection
        # on main/develop requires `Claude On-Demand` as a status check, so
        # this PATCH is what actually gates merge for auto-escalated PRs.
        #
        # The check was created on the PR HEAD SHA by claude-code-review.yml's
        # init-deep-check job (or by the Upsert step above for manual triggers)
        # — finding it by `(head_sha, name)` and PATCHing it ensures the
        # check stays attached to the PR HEAD SHA regardless of the
        # issue_comment-event check-run attachment quirk that historically
        # broke the fold-in architecture.
        #
        # The action posts a comment starting with "**Claude finished
        # @claude[bot]'s task in <duration>**" when Opus completes its review.
        # We re-read that comment and translate to check conclusion.
        if: always() && steps.pr-head.outputs.head_sha != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr-head.outputs.pr_number }}
          HEAD_SHA: ${{ steps.pr-head.outputs.head_sha }}
        run: |
          REPO="${{ github.repository }}"

          # ── Stale-comment floor (current-run correlation) ─────────────────
          # `Evaluate deep-tier verdict` runs via `if: always()` even when
          # Run Claude failed silently (hit --max-turns, gh post failure,
          # network blip mid-completion-comment). The CHECK_ID lookup binds
          # to HEAD_SHA, but a naive `| last` on the comments endpoint would
          # pick the PRIOR push's stale 🟢 completion comment and PATCH the
          # current HEAD SHA's check to success based on an older verdict.
          # Filter comments by created_at >= this run's run_started_at to
          # reject completion comments from prior pushes (mirrors the same
          # pattern in claude-code-review.yml's evaluate-review-outcome).
          RUN_STARTED_AT=$(gh api "repos/$REPO/actions/runs/${{ github.run_id }}" --jq '.run_started_at')
          if [ -z "$RUN_STARTED_AT" ]; then
            echo "::error::Could not resolve current run's run_started_at — refusing to evaluate verdict without stale-comment floor"
            exit 1
          fi

          COMMENT=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            | jq -r --arg ts "$RUN_STARTED_AT" \
                '[.[] | select(.user.login == "claude[bot]") | select(.body | startswith("**Claude finished")) | select(.created_at >= $ts)] | last | .body // ""')

          CHECK_ID=$(gh api \
            "repos/$REPO/commits/$HEAD_SHA/check-runs?check_name=Claude%20On-Demand&per_page=100" \
            --jq '[.check_runs[] | select(.name == "Claude On-Demand")] | first | .id // empty')
          if [ -z "$CHECK_ID" ]; then
            echo "::error::Claude On-Demand check not found on $HEAD_SHA — Upsert step must have failed"
            exit 1
          fi

          if [ -z "$COMMENT" ]; then
            # FAIL-CLOSED: neutral counts as passing in required status checks — failure blocks merge; admin-bypass required for genuine Opus outages.
            echo "::error::No deep-tier completion comment found — Opus action errored or skipped. Setting check to failure (fail-closed)."
            gh api "repos/$REPO/check-runs/$CHECK_ID" -X PATCH \
              -F status="completed" \
              -F conclusion="failure" \
              -F "output[title]=Deep review errored" \
              -F "output[summary]=The Opus action did not post a completion comment (errored or skipped). Re-trigger with \`@claude review this PR — depth pass on <focus>\` to retry. If the deep tier is genuinely broken, admin-bypass leaves an audit trail."
            exit 1
          fi

          # Verdict is the LAST line containing 🔴 or 🟢. Robust to recap text.
          VERDICT_LINE=$(printf '%s\n' "$COMMENT" | grep -E "🔴|🟢" | tail -n 1)
          if [ -z "$VERDICT_LINE" ]; then
            echo "::error::Deep-tier comment has no 🔴/🟢 verdict at all"
            gh api "repos/$REPO/check-runs/$CHECK_ID" -X PATCH \
              -F status="completed" \
              -F conclusion="failure" \
              -F "output[title]=Deep review verdict missing" \
              -F "output[summary]=Opus completed but did not include a 🔴/🟢 verdict line. Re-trigger and ensure the prompt mandates a binary verdict on the final line."
            exit 1
          fi

          if echo "$VERDICT_LINE" | grep -qF "🔴"; then
            echo "::error::Deep-tier verdict: 🔴 Blocking — merge blocked"
            gh api "repos/$REPO/check-runs/$CHECK_ID" -X PATCH \
              -F status="completed" \
              -F conclusion="failure" \
              -F "output[title]=Deep review verdict: 🔴 Blocking" \
              -F "output[summary]=Opus returned a blocking verdict. Fix on the PR branch and re-trigger with \`@claude review this PR — depth pass on <focus>\` after addressing. If the finding is genuinely not applicable, admin-bypass leaves an audit trail."
            exit 1
          fi

          echo "✅ Deep-tier verdict clean — PATCHing Claude On-Demand to success"
          gh api "repos/$REPO/check-runs/$CHECK_ID" -X PATCH \
            -F status="completed" \
            -F conclusion="success" \
            -F "output[title]=Deep review verdict: 🟢 LGTM" \
            -F "output[summary]=Opus signed off. Merge gate's deep-tier requirement satisfied."
          exit 0
