# Routine PR review — Sonnet 4.6, binary 🔴/🟢 verdict
# Verdict resolution lives in a SEPARATE job from the review action. The
# gate folds in the deep-tier verdict (claude.yml) when the routine reviewer
# applies the `needs-deep-review` label — the gate re-fires on the deep
# tier's "Claude finished" completion comment so a deep-tier 🔴 blocks merge
# the same way a routine-tier 🔴 does.
# Requires: CLAUDE_CODE_OAUTH_TOKEN in repo secrets.
#
# PERMANENT LIMITATION — workflow-touching PRs require admin-bypass:
#   The Anthropic Claude Code GitHub App validates that the workflow file on a PR's
#   head ref is byte-identical to the version on the default branch before granting
#   an OIDC-exchanged token. Any PR that edits .github/workflows/claude*.yml therefore
#   fails the token exchange and the routine review action cannot post a verdict.
#   Confirm via `gh run view --job <id> --log-failed` and admin-bypass once.

name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [develop, main]
  issue_comment:
    types: [created]
    # The gate folds in the deep-tier verdict when `needs-deep-review` is
    # applied. When the deep tier finishes, `claude[bot]` posts a "Claude
    # finished …" completion comment — that's an `issue_comment` event, NOT
    # a `pull_request` event. Without this trigger, the gate from the last
    # pull_request run would be frozen on the routine verdict only; we'd
    # never see the deep tier's 🔴. The evaluate-review-outcome job below
    # filters issue_comment events so it only fires for those completion
    # comments.

concurrency:
  # Cancel in-flight reviews when a newer commit lands on the same PR. The
  # event_name suffix keeps issue_comment re-evaluations from cancelling
  # in-flight pull_request reviews (and vice versa) — they belong to
  # different concurrency groups so each event type queues independently.
  group: claude-review-pr-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  triage:
    name: Diff triage
    # PR events only — issue_comment events skip triage + claude-review and
    # go straight to evaluate-review-outcome (which re-reads state from
    # comments + labels rather than re-running the review pipeline).
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      run_review: ${{ steps.classify.outputs.run_review }}
    steps:
      - name: Classify diff
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}
          gh pr diff $PR --repo $REPO --name-only > /tmp/changed_files.txt
          # Reviewable: source/contract files OR high-blast-radius _core/ content.
          # .template  = canonical workflow templates in _core/
          # ^_core/    = all of _core/ (rules, skills, templates) — lands verbatim in user repos
          # .additions = CLAUDE.md.additions → goes into users' ~/.claude/CLAUDE.md
          # bundle.toggles.md = bundle defaults for downstream binds
          REVIEWABLE=$(grep -E '\.(html|jsx|js|json|yml|yaml|py|template)$|^_core/|\.additions$|/bundle\.toggles\.md$' /tmp/changed_files.txt || true)
          if [ -z "$REVIEWABLE" ]; then
            echo "Diff has no reviewable source / data / contract files — skipping review."
            echo "run_review=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Reviewable changes detected; running review."
          echo "run_review=true" >> "$GITHUB_OUTPUT"

  claude-review:
    name: Auto review (Sonnet 4.6)
    needs: triage
    if: github.event_name == 'pull_request' && needs.triage.outputs.run_review == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # ── Pre-screen: deterministic Python checks over the diff ────────────────
      # Catches mechanical rule violations before Sonnet sees them. Sonnet then
      # trusts the report and spends turns on judgment work — NOT re-discovering
      # grep-able patterns. This is what makes the `Bash(gh *),Read` allowlist
      # the right size: Sonnet doesn't need `cat`/`grep`/`wc` because the pre-
      # screen already did that work.
      - name: Pre-screen PR diff
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          PR=${{ github.event.pull_request.number }}
          REPO=${{ github.repository }}

          gh pr diff $PR --repo $REPO > /tmp/pr_diff.txt
          gh pr diff $PR --repo $REPO --name-only > /tmp/changed_files.txt

          python3 - << 'PYEOF'
          import os
          import re
          from collections import Counter

          PR = os.environ.get('PR_NUMBER', '?')

          with open('/tmp/pr_diff.txt') as f:
              diff = f.read()
          with open('/tmp/changed_files.txt') as f:
              changed = [l.strip() for l in f if l.strip()]

          # Parse the diff into per-file added-line sections.
          per_file_added = {}
          for sec in re.split(r'(?=^diff --git )', diff, flags=re.MULTILINE):
              m = re.search(r'^diff --git a/(.+?) b/', sec, re.MULTILINE)
              if not m:
                  continue
              fname = m.group(1)
              added = [l[1:] for l in sec.splitlines() if l.startswith('+') and not l.startswith('+++')]
              per_file_added[fname] = added

          violations = []   # rule-breakage — likely 🔴 unless the reviewer disagrees
          warnings   = []   # likely-needs-attention — reviewer judges

          # ── Check 1: Toggle marker balance ───────────────────────────────────
          # Every `<!-- TOGGLE:name START -->` (and `name:off`) must have a
          # matching `<!-- TOGGLE:name END -->` in the SAME file. A missing END
          # silently swallows downstream content during SETUP-time resolution.
          # Scope-guarded to _core/project-template/** — toggle markers only
          # exist canonically inside that subtree. Without the guard, markdown
          # documentation prose that quotes the marker syntax (e.g. CHANGELOG
          # entries describing the pre-screen feature in backticked examples)
          # produces false-positive TOGGLE_UNBALANCED violations because the
          # regex is markdown-unaware and counts literal text in code spans.
          toggle_pat = re.compile(r'<!--\s*TOGGLE:([\w:_\-]+)\s+(START|END)\s*-->')
          for fname in changed:
              if not fname.startswith('_core/project-template/'):
                  continue
              if not fname.endswith(('.md', '.template', '.yml', '.yaml', '.html')):
                  continue
              try:
                  with open(fname) as f:
                      src = f.read()
              except OSError:
                  continue
              starts = Counter(m.group(1) for m in toggle_pat.finditer(src) if m.group(2) == 'START')
              ends   = Counter(m.group(1) for m in toggle_pat.finditer(src) if m.group(2) == 'END')
              for name in (starts | ends).keys():
                  if starts[name] != ends[name]:
                      violations.append(f'TOGGLE_UNBALANCED: {fname}: name={name} START={starts[name]} END={ends[name]}')

          # ── Check 2: Placeholder validation in canonical templates ──────────
          # Every `{{NAME}}` in `_core/project-template/**` must be one of the
          # placeholders SETUP.md knows how to resolve. An unknown placeholder
          # lands literally in the user's repo on bind.
          CANONICAL = {
              'MAIN_BRANCH', 'DEV_BRANCH', 'DEFAULT_BRANCH',
              'PROJECT_NAME', 'PROJECT_NAME_UPPER',
              'LANGUAGE_AND_FRAMEWORK',
              'CONVERSATION_LANGUAGE', 'CODE_LANGUAGE',
              'REPO_URL', 'ONE_LINE_DESCRIPTION',
              'GITFLOW_OR_TRUNK',
              'TIMEZONE',
              # v1.3.0 — `tools.code_research` slot, per-tool resolution at
              # bind time from `manifest.tools` + `code-research-profiles.json`.
              # See SETUP.md Phase 3 step 2 + TOGGLES.md per-value markers.
              'TOOLS_CODE_RESEARCH_NAME',
              'TOOLS_CODE_RESEARCH_URL',
              'TOOLS_CODE_RESEARCH_NAME_KEBAB',
              'TOOLS_CODE_RESEARCH_BYPASS_MARKER',
          }
          placeholder_pat = re.compile(r'\{\{([A-Z][A-Z_]+)\}\}')
          for fname in changed:
              if not fname.startswith('_core/project-template/'):
                  continue
              try:
                  with open(fname) as f:
                      src = f.read()
              except OSError:
                  continue
              for m in placeholder_pat.finditer(src):
                  name = m.group(1)
                  if name not in CANONICAL:
                      violations.append(f'UNKNOWN_PLACEHOLDER: {fname}: {{{{{name}}}}} not in canonical set')

          # ── Check 3: AI-attribution scan ─────────────────────────────────────
          # Scans ADDED lines for the AI-attribution patterns defined in
          # .claude/rules/git.md. The regexes are encoded in ai_pats below
          # (kept structural — readers consult ai_pats, not this comment,
          # to avoid the comment itself re-tripping the scanner on future
          # edits to this workflow file).
          ai_pats = [
              re.compile(r'Co-Authored-By:\s*Claude', re.IGNORECASE),
              re.compile(r'Generated\s+with\s+\[?Claude\s+Code', re.IGNORECASE),
              re.compile(r'claude\.(?:com|ai)\b', re.IGNORECASE),
              re.compile(r'🤖\s*Generated', re.IGNORECASE),
          ]
          for fname, lines in per_file_added.items():
              for line in lines:
                  for pat in ai_pats:
                      if pat.search(line):
                          violations.append(f'AI_ATTRIBUTION: {fname}: {line.strip()[:120]}')
                          break

          # ── Check 4: JSX/HTML parity ─────────────────────────────────────────
          # The redesign/*.jsx source and `index.html` production are kept in
          # manual sync. A JSX edit without a matching HTML edit ships broken.
          jsx_changed = [f for f in changed if f.startswith('redesign/') and f.endswith('.jsx')]
          if jsx_changed and 'index.html' not in changed:
              warnings.append(f'JSX_HTML_PARITY: {", ".join(jsx_changed)} touched but index.html not in diff — production may be out of sync')

          # ── Check 5: Categorize files ────────────────────────────────────────
          ARCH_PREFIXES = ('_core/', 'redesign/')
          ARCH_FILES    = {'index.html', 'SETUP.md', 'TOGGLES.md', 'COMPARISON.md'}
          arch_critical, docs, other_code = [], [], []
          for f in changed:
              if f.startswith('.github/workflows/claude') or any(f.startswith(p) for p in ARCH_PREFIXES) or f in ARCH_FILES:
                  arch_critical.append(f)
              elif f.endswith('.md'):
                  docs.append(f)
              else:
                  other_code.append(f)

          # ── Check 6: Deep-review trigger surface ─────────────────────────────
          # MUST stay in sync with prompt § Step 2.5 and
          # `_core/project-template/.claude/rules/review-tiers.md`.
          DEEP_PREFIXES = ('_core/', 'redesign/')
          DEEP_FILES    = {'index.html'}
          DEEP_HOOKS    = '_core/project-template/.claude/hooks/'
          DEEP_WORKFLOWS = '.github/workflows/claude'  # matches claude.yml + claude-code-review.yml
          deep_paths = [
              f for f in changed
              if any(f.startswith(p) for p in DEEP_PREFIXES)
              or f in DEEP_FILES
              or f.startswith(DEEP_HOOKS)
              or f.startswith(DEEP_WORKFLOWS)
          ]

          # ── Write the review context ─────────────────────────────────────────
          with open('/tmp/review_context.md', 'w') as out:
              out.write(f'# Pre-screen report for PR #{PR}\n\n')

              if violations:
                  out.write(f'## Pre-screen violations ({len(violations)}) — likely 🔴 unless you can refute each\n\n')
                  for v in violations:
                      out.write(f'- `{v}`\n')
                  out.write('\n')
              else:
                  out.write('## Pre-screen violations: none\n\n')

              if warnings:
                  out.write(f'## Pre-screen warnings ({len(warnings)}) — reviewer judges\n\n')
                  for w in warnings:
                      out.write(f'- `{w}`\n')
                  out.write('\n')

              if deep_paths:
                  out.write('## Deep-review trigger surface — auto-escalation REQUIRED (Step 4)\n\n')
                  out.write('These paths are on the deep-review trigger list. You MUST apply the `needs-deep-review` label AND post the structured `@claude review this PR` comment in Step 4, no exceptions:\n\n')
                  for p in deep_paths:
                      out.write(f'- `{p}`\n')
                  out.write('\n')
              else:
                  out.write('## Deep-review trigger surface: none (Step 4 skipped)\n\n')

              out.write('## Architecture-critical files (READ THESE)\n\n')
              if arch_critical:
                  for f in arch_critical:
                      out.write(f'- `{f}`\n')
              else:
                  out.write('_(none)_\n')
              out.write('\n')

              out.write('## Docs / markdown changes (low-risk, scan only)\n\n')
              if docs:
                  for f in docs:
                      out.write(f'- `{f}`\n')
              else:
                  out.write('_(none)_\n')
              out.write('\n')

              out.write('## Other code changes\n\n')
              if other_code:
                  for f in other_code:
                      out.write(f'- `{f}`\n')
              else:
                  out.write('_(none)_\n')

          print(f'Pre-screen complete. Violations={len(violations)}, Warnings={len(warnings)}, Deep-trigger={len(deep_paths)}, Arch-critical={len(arch_critical)}')
          PYEOF

          echo "--- review_context.md ---"
          cat /tmp/review_context.md

      - name: Run Claude Code Review
        id: claude-review
        # Pinned to v1's resolved SHA (resolved 2026-05-04). The bare `@v1`
        # or `@beta` floats — silent behavior changes from auto-updates burned
        # other projects already. Update via
        #   curl -s "https://api.github.com/repos/anthropics/claude-code-action/git/refs/tags/v1" | jq -r '.object.sha'
        # confirm the diff, then bump here AND in `.github/workflows/claude.yml`.
        uses: anthropics/claude-code-action@8c196b2f61a66bfdf93322bde3a3e668669089ed  # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: false
          claude_args: '--allowedTools "Bash(gh *),Read" --max-turns 50 --model claude-sonnet-4-6'
          prompt: |
            Review PR ${{ github.event.pull_request.number }} in ${{ github.repository }} for **claude-code-templates** — the open-source toolkit that ships opinionated Claude Code bundles. The configurator + canonical templates here become the binds every downstream user installs verbatim, so the review surface is load-bearing in a way ordinary OSS isn't.

            ## Step 1 — Read the pre-screen report

            Read `/tmp/review_context.md`. It contains:
            - **Pre-screen violations** — mechanical rule-breakage already detected (toggle marker imbalance, unknown placeholders in canonical templates, AI-attribution markers in added lines). Each violation is likely 🔴 unless you can refute it from the diff.
            - **Pre-screen warnings** — likely issues you should judge (JSX/HTML parity drift, etc.).
            - **Deep-review trigger surface** — if non-empty, Step 4 (label + `@claude` trigger) is mandatory.
            - **Categorized file lists** — architecture-critical files to READ first, then docs (scan only), then other code.

            Then read the PR diff once for the full context: `gh pr diff ${{ github.event.pull_request.number }} --repo ${{ github.repository }}`.

            **Trust the pre-screen.** Do NOT re-run the mechanical checks it already ran (toggle balance, placeholder validation, AI-attribution scan, JSX/HTML parity). Use Read for architecture-critical files; use `gh pr diff` once for the diff; spend remaining turns on judgment work — architectural invariants, semantic regressions, contract drift. The `Bash(gh *),Read` allowlist is exactly sized for this contract — don't try `cat`, `grep`, `wc`, `head`, or `git diff`; they will be denied.

            ## Step 2 — Architectural review

            Read ONLY the files most likely to contain risk. Then expand outward if the architecture review surfaces a concern.

            **Project-specific invariants to verify (in priority order):**

            1. **Canonical template integrity** — anything in `_core/project-template/**` lands verbatim in every downstream bind. Toggle markers (`<!-- TOGGLE:name START/END -->`) must be balanced; placeholders (`{{MAIN_BRANCH}}`, `{{DEV_BRANCH}}`, `{{PROJECT_NAME}}`, etc.) must be the canonical names that SETUP.md resolves. A missing END marker silently swallows downstream content.
            2. **Workflow template parity** — `_core/project-template/.github/workflows/*.template` should behave like this repo's live workflows after substitution. Drift between live and canonical means downstream binds get a different gate than this repo dogfoods.
            3. **Hook safety** — `_core/project-template/.claude/hooks/**` runs on every user's machine. Any Bash / shell / Python edit there must be cross-platform (Linux/macOS/Windows-Git-Bash), POSIX-portable, and never assume a specific PATH or interpreter.
            4. **Configurator (`index.html` + `redesign/*.jsx`)** — JSX source and inlined production HTML are kept manually in sync. A change to `redesign/bind.jsx` that doesn't land in `index.html` ships a broken configurator. Toggle catalog edits must update both the data layer and the manifest emission.
            5. **Bundle defaults (`bundles/<n>/bundle.toggles.md`)** — each bundle's per-toggle default must be defensible. A toggle that flips ON for OSS but OFF for client-team needs a documented reason somewhere (CLAUDE.md, TOGGLES.md, or bundle.toggles.md itself).
            6. **Versioning policy** — major/minor/patch matches the rules in `CHANGELOG.md`. New bundle / new toggle / new tool slot = minor. Bug fix / copy edit = patch. Breaking schema change = major.
            7. **No AI-attribution markers** — per `_core/project-template/.claude/rules/git.md`, never `Co-Authored-By: Claude`, never "Generated with Claude Code" footers, never claude.com links in PR bodies or commit messages.

            ## Step 2.5 — Decide whether to escalate (do not post yet)

            Escalation is *orthogonal* to the verdict — it's "deeper look requested," not a blocker. The verdict in Step 3 stays binary regardless.

            **Mark for escalation when ALL hold:**
            1. The concern is about correctness, not style.
            2. You can articulate a *specific* reason an Opus reviewer would catch what you cannot.
            3. You would not stake the merge on your own verdict for that concern.

            **Auto-escalate (always mark) when the diff includes any of:**
            - `_core/**` (canonical templates that every downstream bind copies)
            - `index.html` (the deployed configurator)
            - `_core/project-template/.claude/hooks/**` (hooks that run on user machines)
            - `redesign/*.jsx` (configurator source)
            - `bundles/<n>/bundle.toggles.md` defaults changes
            - SETUP.md contract changes
            - `_core/project-template/.github/workflows/*.template` (canonical CI)

            **Do NOT mark for escalation:** docs, comments, formatting, naming nits, "consider extracting", pure refactors with no behavior change.

            ## Step 3 — Post the verdict comment FIRST

            Command: `gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "BODY"`

            The verdict lands BEFORE the escalation comment so PR readers see the decision first.

            **Verdict is BINARY** — only 🔴 (Blocking) or 🟢 (LGTM). No middle ground.

            Body MUST:
            - Be titled `## Code Review — claude-code-templates`
            - End with EXACTLY one of these as the FINAL line of the comment (no trailing prose after):
              - `🟢 LGTM`
              - `🔴 Blocking — must fix`

            **BINARY VERDICT RULE:**
            - 🟢 LGTM ONLY when fully clean — zero caveats, zero minors, zero nits, zero "with caveats" headings.
            - 🔴 Blocking when ANY real finding exists, regardless of framing. "Minor nit" that suggests a real correctness improvement is 🔴. "All clear with caveats" is a contradiction — caveats make it 🔴.
            - DROP style preferences, micro-optimisations, future-proofing for hypothetical changes, "consider extracting" suggestions. Don't list them as non-blocking; just drop them.
            - "All clear on X" is allowed AS A SECTION HEADING. NEVER as the verdict line when other sections have findings.

            **MANDATORY when you marked the PR for escalation in Step 2.5 (auto-escalate OR uncertainty-based):** before the final verdict line, append a `### 🟡 Uncertainty surfaced — needs-deep-review requested` section. PR readers must see *what specifically* the deep pass is being asked to verify, not just *that* a deep pass was triggered. A `@claude review this PR` trigger comment without a 🟡 section in the verdict above it is unmotivated and degrades the deep tier's signal quality — readers see only the trigger, not the rationale.

            Format (this block goes BEFORE the final verdict line; verdict stays binary 🟢/🔴):

            ```
            ### 🟡 Uncertainty surfaced — needs-deep-review requested

            - `<file:line>` — <what specifically concerns you about this change in 1 sentence>.
              **Why I am not confident:** <one sentence on the limit of your analysis — what you cannot fully verify from the diff/the files you read>.
              **What I want Opus to verify:** <one sentence naming the concrete check — invariant, contract, edge case>.
            - ...

            A depth-pass request follows in the next comment.
            ```

            For auto-escalated paths with no genuine uncertainty in your own read: still enumerate at least one concrete concern about THIS PR's changes on those paths — what regression a deep pass should mechanically rule out, what invariant could silently break. "Path is on the auto-escalate list" alone is NOT a sufficient 🟡 entry; the trigger comment in Step 4 already says that. If you truly have nothing concrete to surface, that is signal that escalation is wrong for this PR — reconsider Step 2.5 and skip Step 4.

            🟡 is NEVER the verdict line. A 🟢 verdict CAN carry a 🟡 section (genuinely-clean PR where the deep tier should still verify a specific concern). A 🔴 verdict CAN ALSO carry a 🟡 section (blocking findings plus uncertain ones for Opus). Binary verdict + optional 🟡 section are independent dimensions.

            ## Step 4 — IF you escalated in Step 2.5: apply label + post @claude trigger

            Only run Step 4 if Step 2.5 marked the PR for escalation. Skip otherwise.

            Do BOTH of the following on every escalating run — the label and the comment have different lifecycles:

            **A. Apply the label (idempotent — safe to re-apply if already present):**
            ```
            gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label needs-deep-review
            ```

            **B. Post a fresh `@claude` comment EVERY escalating run, no exceptions:**
            ```
            gh pr comment ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --body "@claude review this PR — depth pass on <focus>.

            <One-paragraph context: what the PR ships and why the risk surface is bigger than the diff suggests.>

            **Numbered invariants ranked by priority:**
            1. **<file:line>** — <invariant + how it could break>
            2. ...

            **Out of scope:** <list of intentional deferrals>

            **Verdict format — BINARY, no in-between.** Same rule as the routine tier:
            - 🟢 LGTM ONLY when fully clean — zero caveats, zero minors, zero nits.
            - 🔴 Blocking when ANY real finding exists, regardless of framing.
            - DROP style preferences and micro-optimisations entirely.

            **Output spec:** bullet-point findings ranked by severity with file:line citations. The verdict line is the FINAL line of the comment — `🟢 LGTM` or `🔴 Blocking — must fix`, no trailing prose."
            ```

            **CRITICAL — do not skip step B because a prior `@claude` comment exists on this PR.** The `claude.yml` deep-review workflow only fires on the `issue_comment` event for the CURRENT comment — it does not re-evaluate older comments when a new push lands. Every escalation must repost a fresh comment, and the comment body MUST start with the literal `@claude` token (not in backticks, not in a markdown header) so both the workflow's `if: contains(body, '@claude review this PR')` condition AND the action's internal trigger detector evaluate true. If the only `@claude` in your comment is inside backticks or a code block, the deep tier silently skips.

  # ── Evaluate: combine routine + deep tier into a single merge-gate check. ──
  # This job is the merge gate's status check. It MUST run for every PR
  # (including non-reviewable docs/rules/context-refresh PRs) so the
  # develop / main rulesets' required-status-check named "Evaluate review
  # outcome" always resolves to a status. It also re-fires on the deep tier's
  # "Claude finished" completion comment so the gate flips to red when the
  # deep tier returns 🔴 — otherwise the routine 🟢 from the last PR-event
  # run would still mark the PR mergeable and the deep tier's 🔴 would never
  # gate anything.
  #
  # Gate logic:
  #   1. Triage classified the diff as non-reviewable → auto-pass (no Sonnet
  #      minutes burned for docs/rules/context-refresh PRs).
  #   2. Routine review job didn't reach success → fail (action errored, OIDC
  #      tripped, workflow-validation skip, runner crash, cancellation race).
  #   3. Routine verdict comment missing or 🔴 → fail.
  #   4. Routine 🟢:
  #        a. `needs-deep-review` label NOT applied → pass (deep tier was not
  #           auto-escalated for this PR; manual @claude triggers without the
  #           label remain advisory).
  #        b. Label applied + deep tier verdict comment 🟢 → pass.
  #        c. Label applied + deep tier verdict 🔴 → fail.
  #        d. Label applied + no deep tier verdict yet → fail (pending).
  #
  # Dismiss path for the user: remove the `needs-deep-review` label from the
  # PR in the GitHub UI. The next event (push, comment, etc.) re-evaluates
  # the gate and 4a applies → pass. Re-trigger with `@claude review this PR
  # — depth pass on <focus>` after addressing if a fresh deep verdict is
  # wanted instead.
  evaluate-review-outcome:
    name: Evaluate review outcome
    needs: [triage, claude-review]
    # Run on every PR event; on issue_comment events, only run when the
    # comment is the deep tier's "Claude finished" completion — that's the
    # only issue_comment that can flip the gate's state.
    if: |
      always() && (
        github.event_name == 'pull_request' ||
        (github.event_name == 'issue_comment' && github.event.issue.pull_request != null && contains(github.event.comment.body, 'Claude finished'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      # actions: read needed for the HEAD-SHA-floor lookup: the verdict
      # correlation logic queries `/repos/.../actions/runs?head_sha=...`
      # to compute the earliest run_started_at on the PR's current HEAD,
      # used as the cutoff for both verdict-comment reads. Without this
      # permission the gh api call returns HTTP 403 and the gate fails
      # closed.
      actions: read
    steps:
      - name: Resolve combined verdict
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number || github.event.issue.number }}"
          IS_PR_EVENT="${{ github.event_name == 'pull_request' }}"

          # ── Verdict-read floor (current-push correlation) ────────────────
          # The verdict reads below (routine + deep) used to pick the latest
          # matching comment with `| last` and no cutoff. That admits a stale
          # 🟢 from a prior push when a subsequent push's run fails to post
          # its own verdict (e.g. OIDC workflow-validation skip on a
          # workflow-touching PR): the gate reads `| last`, finds the prior
          # push's 🟢, and exits 0 on the unreviewed payload. `concurrency.
          # cancel-in-progress` cancels in-flight runs but cannot un-post a
          # completed run's verdict, so structural correlation is needed.
          #
          # Mechanism: compute the earliest run_started_at across every
          # workflow run that fired on the PR's current HEAD SHA. Any verdict
          # belonging to the current push must have been posted after that
          # floor. New push → new HEAD SHA → new floor → both verdicts must
          # be re-posted to count. Stale verdicts from an earlier HEAD SHA
          # are structurally rejected.
          #
          # Both tiers use the same floor because the deep tier verdict is
          # posted in a *different workflow run* (claude.yml) than this
          # evaluate run, so the current-run's run_started_at would reject
          # every valid deep verdict. HEAD-SHA floor is the unified cutoff
          # that covers both reads.
          HEAD_SHA=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER" --jq '.head.sha')
          HEAD_SHA_FLOOR=$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs?head_sha=$HEAD_SHA&per_page=100" \
            --jq '[.workflow_runs[].run_started_at] | min // empty')
          if [ -z "$HEAD_SHA_FLOOR" ]; then
            echo "::error::Could not determine HEAD-SHA floor (no workflow runs found for $HEAD_SHA) — refusing to evaluate verdicts without correlation"
            exit 1
          fi
          echo "::notice::HEAD-SHA floor for verdict correlation: $HEAD_SHA_FLOOR (HEAD $HEAD_SHA)"

          # ── Routine tier ──────────────────────────────────────────────────
          # PR events: rely on the `needs` outputs (triage classifier +
          # claude-review job result) since those jobs just ran. issue_comment
          # events: those jobs didn't run on this trigger, so skip the
          # short-circuits and read the latest routine verdict comment.
          if [ "$IS_PR_EVENT" = "true" ]; then
            if [ "${{ needs.triage.outputs.run_review }}" != "true" ]; then
              echo "::notice::Triage classified diff as non-reviewable — skipping routine verdict read"
              ROUTINE_STATUS=skip
            elif [ "${{ needs.claude-review.result }}" != "success" ]; then
              echo "::error::Claude review job did not complete successfully (result: ${{ needs.claude-review.result }})"
              exit 1
            else
              ROUTINE_STATUS=eval
            fi
          else
            # issue_comment event — routine ran on a prior pull_request event;
            # read the latest verdict comment to determine its state.
            ROUTINE_STATUS=eval
          fi

          if [ "$ROUTINE_STATUS" = "eval" ]; then
            # --paginate is mandatory: the comments endpoint defaults to 30
            # per page ascending, so on a long-thread PR the verdict comment
            # lands on a later page and `| last` would silently pick a stale
            # verdict from page 1 instead of the real latest. Cheap defence —
            # the call is rare (only on merge-gate evaluation, not in hot
            # paths) and the extra pages are typically empty for our PRs.
            # The `created_at >= HEAD_SHA_FLOOR` filter binds the verdict to
            # the current push: a stale 🟢 from a prior HEAD SHA is rejected.
            ROUTINE_COMMENT=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              | jq -r --arg ts "$HEAD_SHA_FLOOR" \
                  '[.[] | select(.body | contains("## Code Review — claude-code-templates")) | select(.created_at >= $ts)] | last | .body // ""')
            if [ -z "$ROUTINE_COMMENT" ]; then
              if [ "$IS_PR_EVENT" = "true" ]; then
                echo "::error::No routine review comment found — Claude did not post a verdict this run"
                exit 1
              else
                echo "::notice::No routine review comment yet on this PR — issue_comment re-evaluation skipped (deferring to next pull_request run)"
                exit 0
              fi
            fi
            # Read the LAST line of the comment that carries a verdict emoji,
            # not the whole body. A 🟢 review whose body recaps a prior 🔴
            # finding (e.g., "### Previous finding — addressed: the 🔴 from
            # the prior pass is now resolved …") would otherwise false-block
            # when grep matched the recap text. The canonical verdict line is
            # always the last line containing 🔴 or 🟢.
            ROUTINE_VERDICT_LINE=$(printf '%s\n' "$ROUTINE_COMMENT" | grep -E "🔴|🟢" | tail -n 1)
            if [ -z "$ROUTINE_VERDICT_LINE" ]; then
              echo "::error::Routine review comment has no 🔴/🟢 verdict line"
              exit 1
            fi
            if echo "$ROUTINE_VERDICT_LINE" | grep -qF "🔴"; then
              echo "::error::Routine review verdict: 🔴 Blocking — must fix"
              exit 1
            fi
            echo "✅ Routine review verdict: 🟢 LGTM"
          fi

          # ── Deep tier ─────────────────────────────────────────────────────
          # Gate folds in deep tier ONLY when `needs-deep-review` is applied
          # (the routine review's auto-escalation applies it; users can also
          # apply it manually). Removing the label dismisses the gate.
          LABELS=$(gh pr view "$PR_NUMBER" --repo "${{ github.repository }}" --json labels --jq '[.labels[].name] | join(",")')
          if ! echo "$LABELS" | grep -q "needs-deep-review"; then
            echo "✅ Deep tier not required (no needs-deep-review label) — merge gate passes"
            exit 0
          fi

          # --paginate per the routine-tier read above — same reason: default
          # page size of 30 ascending would silently truncate on long PRs and
          # `| last` would pick a stale verdict from the latest fetched page.
          # `created_at >= HEAD_SHA_FLOOR` rejects deep verdicts that belong
          # to a prior push's HEAD SHA. The deep tier posts from claude.yml
          # in a separate run, so current-run started_at would over-reject;
          # HEAD-SHA floor is the correct correlation primitive here.
          DEEP_VERDICT=$(gh api --paginate "repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            | jq -r --arg ts "$HEAD_SHA_FLOOR" \
                '[.[] | select(.user.login == "claude[bot]") | select(.body | contains("Claude finished")) | select(.created_at >= $ts)] | last | .body // ""')
          if [ -z "$DEEP_VERDICT" ]; then
            echo "::error::Deep tier was escalated (needs-deep-review label applied) but verdict not yet posted — merge gate pending"
            echo "::error::Wait for the deep tier to complete, OR remove the 'needs-deep-review' label if deep tier no longer applies"
            exit 1
          fi
          # Same last-verdict-line rule as the routine read above — a 🟢 deep
          # tier whose body recaps a prior 🔴 finding must not false-block on
          # the recap text.
          DEEP_VERDICT_LINE=$(printf '%s\n' "$DEEP_VERDICT" | grep -E "🔴|🟢" | tail -n 1)
          if [ -z "$DEEP_VERDICT_LINE" ]; then
            echo "::error::Deep tier verdict comment has no 🔴/🟢 verdict line"
            exit 1
          fi
          if echo "$DEEP_VERDICT_LINE" | grep -qF "🔴"; then
            echo "::error::Latest deep tier verdict: 🔴 Blocking — must fix"
            echo "::error::Re-trigger with '@claude review this PR — depth pass on <focus>' after addressing, OR remove the 'needs-deep-review' label if deep tier no longer applies"
            exit 1
          fi
          echo "✅ Routine 🟢 + deep tier 🟢 — merge gate passes"
          exit 0
