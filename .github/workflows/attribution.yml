name: Attribution

# The server-side backstop to the local attribution guards. The local hook and
# the guards mod catch AI credit written the ordinary way from a session; a
# commit made elsewhere, or a write that slipped past them, reaches this check.
# It fails a pull request when:
# - one of its commits' messages, its title or its body carries AI
#   attribution: an AI Co-Authored-By, an Anthropic noreply address, a
#   "generated with" line, a session link or the robot emoji. Plain mentions
#   of the product pass. The title and body are also read as GitHub renders
#   them.
# - a commit's author, committer or co-author is not listed in
#   `.github/attribution-identities.txt`: an AI account fails whatever its
#   name, with no list of AI names to keep current.
# - a commit cannot be read plainly (any encoding but UTF-8, a repeated
#   author, committer or encoding line), or a text cannot: a word mixing
#   alphabets or using a letter outside modern use, right-to-left letters
#   next to left-to-right ones, direction
#   marks or a direction set by hand, characters newer than the runner's
#   Unicode, math, ruby text, or diagrams drawn in the browser.
#
# A pull request cannot weaken the check on itself:
# - `pull_request_target` runs this file as the default branch (`main`)
#   holds it, never the PR's copy, so editing the workflow in a PR changes
#   nothing for it.
# - The identity list is read from protected `main`'s current tip (one list
#   for PRs into either branch, so a release reads the same names), and the
#   patterns are the shipped hook's own (`ATTRIBUTION` in
#   `_core/global-template/hooks/no-ai-attribution.py`), read from protected
#   `develop`'s; neither comes from the pull request.
# That trigger is safe only while nothing from the PR runs: its commits are
# fetched as objects and read raw with `git cat-file`, never checked out, and
# its text reaches the script through the environment. Keep it that way. No
# manual trigger.

on:
  pull_request_target:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Under `pull_request_target`, `github.ref` is not the PR's: group by PR.
concurrency:
  group: attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  attribution:
    name: No AI attribution
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # The base branch, never the PR's head.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Objects only: nothing from the PR is checked out or run.
      - name: Fetch the PR's commits
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"

      # Both from the protected branches' current tips, not the event's
      # checkout: a re-run after the maintainer lists someone reads the new
      # list.
      - name: Read the hook's patterns and the identity list
        run: |
          git fetch --no-tags origin develop main
          git show origin/develop:_core/global-template/hooks/no-ai-attribution.py > "$RUNNER_TEMP/attribution_hook.py"
          git show origin/main:.github/attribution-identities.txt > "$RUNNER_TEMP/attribution-identities.txt"

      # Unicode's own data, pinned to 17.0.0 by checksum: which script each
      # letter belongs to, which letters look like others, and which are in
      # modern use (UTS #39).
      - name: Fetch the Unicode script, look-alike and letter-status tables
        run: |
          mkdir -p "$RUNNER_TEMP/ucd"
          cd "$RUNNER_TEMP/ucd"
          curl -sSfL -o Scripts.txt https://www.unicode.org/Public/17.0.0/ucd/Scripts.txt
          curl -sSfL -o confusables.txt https://www.unicode.org/Public/17.0.0/security/confusables.txt
          curl -sSfL -o IdentifierStatus.txt https://www.unicode.org/Public/17.0.0/security/IdentifierStatus.txt
          sha256sum -c - <<'SUMS'
          9f5e50d3abaee7d6ce09480f325c706f485ae3240912527e651954d2d6b035bf  Scripts.txt
          091c7f82fc39ef208faf8f94d29c244de99254675e09de163160c810d13ef22a  confusables.txt
          617228a16da13850bf8af28b6cd08f5e9b6595d2eb60404fe6eee2c85b4e4a35  IdentifierStatus.txt
          SUMS

      # The PR's text reaches the script through the environment, never the
      # script's own text, so a title or body cannot run as code.
      - name: Scan the commits, title and body
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_LABEL: ${{ github.event.pull_request.head.label }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'EOF'
          import html, importlib.util, json, os, re, subprocess, sys, unicodedata
          import urllib.parse, urllib.request

          spec = importlib.util.spec_from_file_location(
              "attribution_hook", os.path.join(os.environ["RUNNER_TEMP"], "attribution_hook.py"))
          hook = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(hook)

          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True).stdout

          def read_commit(sha):
              """A commit's author, committer and message, parsed from its raw
              object: git's formatter re-encodes a commit that names another
              encoding, which can blank every field. Only plain UTF-8 passes."""
              try:
                  raw = git("cat-file", "commit", sha).decode("utf-8")
              except UnicodeDecodeError:
                  sys.exit(f"::error::commit {sha[:7]} is not valid UTF-8, so it cannot be checked.")
              head, _, message = raw.partition("\n\n")
              fields = {}
              for line in head.split("\n"):
                  key, _, value = line.partition(" ")
                  if not key:  # a line starting with a space continues a signature
                      continue
                  if key in fields and key in ("author", "committer", "encoding"):
                      sys.exit(f"::error::commit {sha[:7]} has two {key} lines, so it cannot be checked.")
                  fields.setdefault(key, value)
              encoding = fields.get("encoding", "UTF-8")
              if encoding.lower().replace("-", "") != "utf8":
                  sys.exit(f"::error::commit {sha[:7]} is stored as {encoding}: only UTF-8 commits can be checked.")
              stamp = re.compile(r" \d+ [+-]\d{4}$")
              return stamp.sub("", fields["author"]), stamp.sub("", fields["committer"]), message

          # Who may author, commit or co-author: the identities listed in
          # `main`'s `.github/attribution-identities.txt`, exactly. An AI
          # account of any name fails without a list of AI names to keep
          # current, and a new contributor is listed once the maintainer has
          # read their pull request.
          with open(os.path.join(os.environ["RUNNER_TEMP"], "attribution-identities.txt"),
                    encoding="utf-8") as listed:
              KNOWN = {line.strip() for line in listed if line.strip() and not line.startswith("#")}
          CO_AUTHOR = re.compile(r"^[ \t]*co[\W_]*authored[\W_]*by[ \t]*:[ \t]*(.*?)[ \t]*$", re.I | re.M)
          # The trailer exactly as GitHub reads it, one line: the only form
          # unlisted() may remove.
          TRAILER = re.compile(r"^[ \t]*co-authored-by:[ \t]*(.*?)[ \t]*$", re.I | re.M)

          FILLERS = "\u115f\u1160\u2800\u3164\uffa0"
          # Direction overrides and marks show letters in another order than
          # stored: a right-to-left mark between letters flips them.
          OVERRIDES = re.compile("[\u061c\u200e\u200f\u202a-\u202e\u2066-\u2069]")

          def unknown(text):
              """Whether the text holds a code point the runner's Unicode does
              not know. It is older than the pinned tables, so a mark or
              letter added since reads as unassigned and is neither dropped
              nor folded; unassigned invisible ones draw nothing at all."""
              return any(unicodedata.category(c) == "Cn" for c in text)

          def mixed_direction(text):
              """Whether the text holds right-to-left letters (Arabic, Hebrew)
              and left-to-right ones together. GitHub sets each block's
              direction from its first strong letter, so a line that starts
              right-to-left shows its Latin words in reverse order, which no
              view reads. Text in one direction passes."""
              classes = {unicodedata.bidirectional(c) for c in text}
              return bool(classes & {"R", "AL"}) and "L" in classes

          def bare(text):
              """Every invisible or combining mark dropped. Decomposed first,
              so an accent cannot shelter the letter it sits on."""
              text = unicodedata.normalize("NFD", text)
              text = "".join(c for c in text if c not in FILLERS
                             and unicodedata.category(c) not in ("Cf", "Mn", "Me"))
              return unicodedata.normalize("NFC", text)

          def fold(text):
              """Bare text with compatibility forms folded (fullwidth letters,
              ligatures). Letters borrowed from another script are
              mixed_alphabets' and LOOKALIKE's."""
              return unicodedata.normalize("NFKC", bare(text))

          UCD = os.path.join(os.environ["RUNNER_TEMP"], "ucd")

          def ucd_rows(name):
              """(first, last, fields) for each data line of a UCD file."""
              with open(os.path.join(UCD, name), encoding="utf-8") as data:
                  for line in data:
                      line = line.split("#", 1)[0].strip()
                      if line:
                          span, *fields = [part.strip() for part in line.split(";")]
                          first, _, last = span.partition("..")
                          yield int(first, 16), int(last or first, 16), fields

          SCRIPT = {}
          for first, last, fields in ucd_rows("Scripts.txt"):
              SCRIPT.update(dict.fromkeys(range(first, last + 1), fields[0]))
          # Script sets one word may mix (UTS #39 "Highly Restrictive"); Common
          # and Inherited letters (digits, marks, punctuation) belong to any.
          NEUTRAL = {"Common", "Inherited", "Unknown"}
          ALLOWED_MIXES = [{"Latin", "Han", "Hiragana", "Katakana"},
                           {"Latin", "Han", "Bopomofo"}, {"Latin", "Han", "Hangul"}]

          # Unicode's look-alike table, kept to letters outside ASCII that
          # stand for ASCII ones (a Cyrillic or Greek "a" read as Latin "a"),
          # so plain Latin text reads unchanged.
          LOOKALIKE = {}
          for source, _, fields in ucd_rows("confusables.txt"):
              # A target's marks dropped: Unicode reads a stroke letter as its
              # base letter plus a stroke ("ø" as "o" + U+0338), and NFD
              # leaves the stroke on, so "ø" reads as "o".
              # A hook is spelled as an apostrophe ("\u0187" as "C'").
              target = "".join(c for c in (chr(int(code, 16)) for code in fields[0].split())
                               if unicodedata.category(c) not in ("Mn", "Me"))
              if any(c.isalpha() for c in target):
                  target = target.replace("'", "")
              if source > 0x7F and target.isascii() and target.strip():
                  # Unicode files I and l under one prototype, "l".
                  upper = chr(source).isupper() and target == "l"
                  LOOKALIKE[source] = "I" if upper else target
          # Letters the table leaves out but whose Unicode name says which Latin
          # letter they draw: small capitals, boxed and regional-indicator
          # letters ("LATIN LETTER SMALL CAPITAL M", "NEGATIVE SQUARED LATIN
          # CAPITAL LETTER A"). Turned, reversed and other variants keep their own.
          NAMED = re.compile(r"(?:LATIN|^REGIONAL INDICATOR SYMBOL).*\b(SMALL LETTER|LETTER|CAPITAL) ([A-Z])$")
          for code in SCRIPT:
              name = unicodedata.name(chr(code), "")
              named = NAMED.search(name)
              # The name wins over a table entry that is no letter: "(a)".
              if (code > 0x7F and not LOOKALIKE.get(code, "").isalpha() and named
                      and not name.startswith("TAG ")):
                  letter = named.group(2)
                  LOOKALIKE[code] = letter.lower() if named.group(1) == "SMALL LETTER" else letter
          # Every look-alike of "l" read as "l": a capital I, "|" or "1" in
          # place of an "l", after LOOKALIKE has read the rest.
          ELL = {source: "l" for source, _, fields in ucd_rows("confusables.txt")
                 if fields[0] == "006C"}

          ELLS = "".join(map(chr, ELL)) + "l"
          CAPS_WORD = re.compile(r"(?:[^\W\d_]|[" + re.escape(ELLS) + r"])+")

          def capitals(match):
              """An all-capitals word with each "l" look-alike read as "I", as
              the font shows it: "Al", "GEMlNl". Lowercase words keep their l."""
              word = match.group(0)
              rest = [c for c in word if c not in ELLS]
              if rest and all(c.isupper() for c in rest):
                  return "".join("I" if c in ELLS else c for c in word)
              return word

          def twins(text):
              """The text read through Unicode's look-alike pairs within ASCII
              itself: "I", "|" or "1" as "l" (and "l" as "I" in an all-capitals
              word), "0" as "O", and "rn" as "m" (the form LOOKALIKE gives every
              "m" look-alike); each alone and together, since reading "AI" as
              "Al" hides the other."""
              ell, caps = text.translate(ELL), CAPS_WORD.sub(capitals, text)
              return [ell, caps] + [view.replace("0", "O").replace("rn", "m")
                                    for view in (text, ell, caps)]

          # Letters in modern use (UTS #39 Identifier_Status Allowed), the
          # allow-list for letters: one outside it (a small capital, a hooked
          # or barred variant, an archaic form) is one no ordinary text needs
          # and a reader may take for a Latin letter. Han ideographs are
          # exempt: rare ones appear in names, and none draws like a Latin one.
          MODERN = set()
          for first, last, fields in ucd_rows("IdentifierStatus.txt"):
              if fields[0] == "Allowed":
                  MODERN.update(range(first, last + 1))

          def odd_letter(text):
              """A letter outside modern use, once compatibility forms are
              folded (so "1\u00ba", fullwidth letters and ligatures pass)."""
              return next((c for c in fold(text) if unicodedata.category(c).startswith("L")
                           and ord(c) not in MODERN and SCRIPT.get(ord(c)) != "Han"), None)

          def mixed_alphabets(text):
              """A word whose letters come from scripts no language mixes in
              one word (a Cyrillic or Greek letter inside a Latin word), by
              Unicode's script data. A letter that looks like no ASCII one
              cannot pose as Latin and counts as neutral ("5 \u03bcs", "10 k\u03a9")."""
              for word in re.findall(r"[^\W\d_]+", bare(text)):
                  scripts = {SCRIPT.get(ord(c), "Unknown") for c in word
                             if ord(c) in LOOKALIKE or SCRIPT.get(ord(c)) == "Latin"} - NEUTRAL
                  if len(scripts) > 1 and not any(scripts <= mix for mix in ALLOWED_MIXES):
                      return word
              return None

          # What the renderer leaves for the browser to draw or arrange, so the
          # page's text does not hold it plainly: math (TeX drops spaces and
          # braces), diagrams and maps, ruby text over letters, and a text
          # direction set by hand (GitHub's own is "auto"), which can swap
          # the order of two pieces.
          UNREADABLE = [("holds math", re.compile(r"<math-renderer")),
                        # A lone <rp> survives and browsers hide it.
                        ("holds ruby text", re.compile(r"<r(?:uby|p|t)\b")),
                        ("holds a diagram drawn in the browser",
                         re.compile(r'class="[^"]*\brender-needs-enrichment\b')),
                        ("sets its own text direction", re.compile(r'\bdir="(?!auto")')),
                        # Markup the browser draws in another order than the
                        # page holds: a table foot or a head after the body, a
                        # details block whose summary is not first, a table or
                        # image floated beside the text.
                        ("lays its text out of order", re.compile(
                            r'<tfoot\b|<tbody\b(?:(?!</table>)[\s\S])*?<thead\b'
                            r'|<details\b[^>]*>(?!\s*<summary\b)'
                            r'|<(?:table|img)\b[^>]*\balign="(?:left|right)"'))]

          # Every tag the renderer keeps, and how it lays text out: an inline
          # tag joins the text on each side, a block or break tag (and an
          # image) starts a new line. A tag in neither list cannot be laid
          # out plainly, so it fails the check.
          INLINE = {"a", "b", "code", "del", "em", "i", "ins", "kbd", "mark", "path", "q", "s",
                    "samp", "span", "strike", "strong", "sub", "sup", "svg", "tt", "var"}
          BLOCK = {"blockquote", "br", "dd", "details", "div", "dl", "dt", "h1", "h2", "h3", "h4",
                   "h5", "h6", "hr", "img", "input", "li", "markdown-accessiblity-table", "ol", "p",
                   "picture", "pre", "section", "source", "summary", "table", "tbody", "td", "th",
                   "thead", "themed-picture", "tr", "ul"}
          TAG = re.compile(r"</?([A-Za-z][\w-]*)[^>]*>")

          def render(text):
              """The text GitHub shows for this Markdown, from GitHub's own
              renderer: inline tags dropped, block tags as line breaks,
              entities decoded, the alt and title texts kept, and every link
              and image address decoded; and what in it cannot be read
              plainly, if anything. Any failure stops the check."""
              request = urllib.request.Request(
                  "https://api.github.com/markdown",
                  data=json.dumps({"text": text, "mode": "gfm",
                                   "context": os.environ["GITHUB_REPOSITORY"]}).encode(),
                  headers={"Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                           "Accept": "application/vnd.github+json"})
              with urllib.request.urlopen(request, timeout=60) as reply:
                  page = reply.read().decode("utf-8")
              labels = re.findall(r'\b(?:alt|title|aria-label)="([^"]*)"', page)
              addresses = re.findall(r'\b(?:href|src|data-canonical-src)="([^"]*)"', page)
              extras = ([html.unescape(label) for label in labels]
                        + [urllib.parse.unquote(html.unescape(url)) for url in addresses])
              laid_out = TAG.sub(lambda m: "\n" if m.group(1).lower() in BLOCK else "", page)
              shown_text = html.unescape(laid_out) + "\n" + "\n".join(extras)
              problem = next((why for why, mark in UNREADABLE if mark.search(page)), None)
              odd = sorted({tag.lower() for tag in TAG.findall(page)} - INLINE - BLOCK)
              if odd and not problem:
                  problem = f"holds HTML the check cannot lay out (<{odd[0]}>)"
              return shown_text, problem

          ROBOT = "\U0001F916"

          def shown(text, is_markdown):
              """The plain views of a text, its look-alike readings, and what
              in it cannot be read plainly. Plain views: as written and
              folded, with the robot shortcode as its emoji (GitHub shows it
              in commit messages too), and for Markdown as GitHub's renderer
              shows it, folded. Readings: each with look-alike letters read
              as Latin, then also through the ASCII look-alike pairs (twins)."""
              views = [text, fold(text), fold(text.replace(":robot:", ROBOT))]
              problem = None
              if is_markdown and text.strip():
                  rendered, problem = render(text)
                  views += [rendered, fold(rendered)]
              looks = [view.translate(LOOKALIKE) for view in views]
              return views, looks + [twin for view in looks for twin in twins(view)], problem

          def unlisted(text):
              """The text with each co-author trailer naming a listed identity
              reduced to a placeholder name. The list judges people, so a
              listed name in another script (an Arabic name beside a Latin
              email) never meets the text checks; the line itself stays, so
              the Markdown around it parses as GitHub parses it."""
              def placeholder(m):
                  if m.group(1).strip() not in KNOWN:
                      return m.group(0)
                  return m.group(0)[:m.start(1) - m.start()] + "a listed contributor"
              return TRAILER.sub(placeholder, text)

          hits = []
          texts = [("the PR title", os.environ.get("PR_TITLE", ""), True),
                   ("the PR body", os.environ.get("PR_BODY", ""), True)]
          # The merge commit's message, whole: its title names the head as
          # "owner/branch" (for a fork, the owner is the contributor's
          # login; the label is "owner:branch", and neither half can hold a
          # colon), and the PR title follows it.
          head = os.environ.get("HEAD_LABEL", "").replace(":", "/", 1)
          merge = (f"Merge pull request #{os.environ.get('PR_NUMBER', '')} from {head}\n\n"
                   f"{os.environ.get('PR_TITLE', '')}")
          branch = [("the merge commit's message", unlisted(merge), False)]
          # The title becomes the merge commit's message, and an edited
          # merge message can carry the body: their co-authors face the list.
          for where, text, _ in texts:
              for ident in CO_AUTHOR.findall(text):
                  if ident.strip() not in KNOWN:
                      hits.append(f"{where}'s co-author '{ident}' is not listed in "
                                  ".github/attribution-identities.txt")
          texts = [(where, unlisted(text), is_markdown) for where, text, is_markdown in texts]
          texts += branch
          # Each commit the PR adds: what its base already holds is not its own.
          # Its people face the list; a listed identity is the maintainer's call.
          span = f"{os.environ['BASE_SHA']}..{os.environ['HEAD_SHA']}"
          for sha in git("rev-list", span).decode().split():
              author, committer, message = read_commit(sha)
              people = [("author", author), ("committer", committer)]
              people += [("co-author", ident) for ident in CO_AUTHOR.findall(message)]
              for role, ident in people:
                  if ident.strip() not in KNOWN:
                      hits.append(f"commit {sha[:7]}'s {role} '{ident}' is not listed in "
                                  ".github/attribution-identities.txt")
              texts.append((f"commit {sha[:7]}'s message", unlisted(message), False))
          # A squash merge joins the messages into one.
          messages = [text for where, text, _ in texts if where.endswith("'s message")
                      and where.startswith("commit ")]
          if len(messages) > 1:
              texts.append(("the commit messages joined", "\n\n".join(messages), False))

          for where, text, is_markdown in texts:
              plain, looks, problem = shown(text, is_markdown)
              # Judged on the plain views, never the look-alike readings (which
              # mix alphabets by design): an entity can spell what the raw text
              # lacks. Mixing is judged before folding, which turns the micro
              # sign (Common) into a Greek letter.
              word = next(filter(None, map(mixed_alphabets, plain[0:1] + plain[3:4])), None)
              letter = next(filter(None, map(odd_letter, plain)), None)
              if word:
                  problem = f"mixes alphabets in '{word}'"
              elif letter:
                  problem = f"uses '{letter}' (U+{ord(letter):04X}), a letter outside modern use"
              elif any(map(unknown, plain)):
                  problem = "holds characters the runner's Unicode does not know"
              elif any(map(mixed_direction, plain)):
                  problem = "mixes right-to-left and left-to-right letters, whose display order differs"
              elif any(OVERRIDES.search(view) for view in plain):
                  problem = "holds direction marks that reorder its letters"
              if problem:
                  hits.append(f"{where} {problem}, so it cannot be checked")
                  continue
              for view in plain + looks:
                  hit = (hook.ATTRIBUTION.search(view)
                         or hook.ATTRIBUTION.search(hook.strip_paths(view)))
                  if hit:
                      hits.append(f"AI attribution in {where}: '{hit.group(0).strip()}'")
                      break
          for line in hits:
              print(f"::error::{line}")
          if hits:
              print("Commits, PRs, issues, comments and releases belong to the maintainer: remove the "
                    "attribution (reword the commits, edit the title or body) and push again. A new "
                    "contributor's own identity is added to .github/attribution-identities.txt by the "
                    "maintainer, once they have read the pull request.")
              sys.exit(1)
          print(f"No AI attribution in {len(texts)} texts.")
          EOF
