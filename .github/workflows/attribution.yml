name: Attribution

# The server-side backstop to the local attribution guards. The local hook and
# the guards mod catch AI credit written the ordinary way from a session; a
# commit made elsewhere, or a write that slipped past them, reaches this check.
# It fails a pull request when:
# - one of its commits' messages, its title or its body carries AI
#   attribution, as the shipped hook's own patterns read it: an AI
#   Co-Authored-By, an Anthropic noreply address, a "generated with" line, a
#   session link or the robot emoji. Each text is read as written, with its
#   HTML entities decoded, and with its Markdown and HTML markup taken out.
# - one of those texts uses a character outside the ones this repository
#   accepts: English text (printable ASCII), common punctuation, arrows, box
#   lines and emoji. The project is written in English; an allow-list keeps
#   look-alike letters from other alphabets, invisible characters and
#   direction marks out without chasing each one (curl keeps its sources the
#   same way).
# - a commit's author, committer or co-author is not listed in
#   `.github/attribution-identities.txt`: an AI account fails whatever its
#   name, with no list of AI names to keep current.
# - a commit cannot be read plainly (any encoding but UTF-8, or a repeated
#   author, committer or encoding line).
#
# A pull request cannot weaken the check on itself:
# - `pull_request_target` runs this file as the default branch (`main`)
#   holds it, never the PR's copy, so editing the workflow in a PR changes
#   nothing for it.
# - The identity list is read from protected `main`'s current tip (one list
#   for PRs into either branch, so a release reads the same names), and the
#   patterns are the shipped hook's own (`ATTRIBUTION` in
#   `_core/global-template/hooks/no-ai-attribution.py`), read from protected
#   `develop`'s; neither comes from the pull request.
# That trigger is safe only while nothing from the PR runs: its commits are
# fetched as objects and read raw with `git cat-file`, never checked out, and
# its text reaches the script through the environment. Keep it that way. No
# manual trigger.

on:
  pull_request_target:
    branches: [develop, main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# Under `pull_request_target`, `github.ref` is not the PR's: group by PR.
concurrency:
  group: attribution-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  attribution:
    name: No AI attribution
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The base branch, never the PR's head.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      # Objects only: nothing from the PR is checked out or run.
      - name: Fetch the PR's commits
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "$HEAD_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"

      # Both from the protected branches' current tips, not the event's
      # checkout: a re-run after the maintainer lists someone reads the new
      # list.
      - name: Read the hook's patterns and the identity list
        run: |
          git fetch --no-tags origin develop main
          git show origin/develop:_core/global-template/hooks/no-ai-attribution.py > "$RUNNER_TEMP/attribution_hook.py"
          git show origin/main:.github/attribution-identities.txt > "$RUNNER_TEMP/attribution-identities.txt"

      # The PR's text reaches the script through the environment, never the
      # script's own text, so a title or body cannot run as code.
      - name: Scan the commits, title and body
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_LABEL: ${{ github.event.pull_request.head.label }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'EOF'
          import html, importlib.util, os, re, subprocess, sys, urllib.parse

          spec = importlib.util.spec_from_file_location(
              "attribution_hook", os.path.join(os.environ["RUNNER_TEMP"], "attribution_hook.py"))
          hook = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(hook)

          def git(*args):
              return subprocess.run(["git", *args], check=True, capture_output=True).stdout

          def read_commit(sha):
              """A commit's author, committer and message, parsed from its raw
              object: git's formatter re-encodes a commit that names another
              encoding, which can blank every field. Only plain UTF-8 passes."""
              try:
                  raw = git("cat-file", "commit", sha).decode("utf-8")
              except UnicodeDecodeError:
                  sys.exit(f"::error::commit {sha[:7]} is not valid UTF-8, so it cannot be checked.")
              head, _, message = raw.partition("\n\n")
              fields = {}
              for line in head.split("\n"):
                  key, _, value = line.partition(" ")
                  if not key:  # a line starting with a space continues a signature
                      continue
                  if key in fields and key in ("author", "committer", "encoding"):
                      sys.exit(f"::error::commit {sha[:7]} has two {key} lines, so it cannot be checked.")
                  fields.setdefault(key, value)
              encoding = fields.get("encoding", "UTF-8")
              if encoding.lower().replace("-", "") != "utf8":
                  sys.exit(f"::error::commit {sha[:7]} is stored as {encoding}: only UTF-8 commits can be checked.")
              stamp = re.compile(r" \d+ [+-]\d{4}$")
              return stamp.sub("", fields["author"]), stamp.sub("", fields["committer"]), message

          # Who may author, commit or co-author: the identities listed in
          # `main`'s `.github/attribution-identities.txt`, exactly. An AI
          # account of any name fails without a list of AI names to keep
          # current, and a new contributor is listed once the maintainer has
          # read their pull request.
          with open(os.path.join(os.environ["RUNNER_TEMP"], "attribution-identities.txt"),
                    encoding="utf-8") as listed:
              KNOWN = {line.strip() for line in listed if line.strip() and not line.startswith("#")}
          CO_AUTHOR = re.compile(r"^[ \t]*co[\W_]*authored[\W_]*by[ \t]*:[ \t]*(.*?)[ \t]*\r?$", re.I | re.M)
          TRAILER = re.compile(r"^([ \t]*co-authored-by:[ \t]*)(.*?)[ \t]*\r?$", re.I | re.M)
          # A direction set by hand in HTML can swap two pieces of a line.
          DIRECTION = re.compile(r"<[A-Za-z][^>]*\sdir\s*=", re.I)
          EMAIL = re.compile(r"[^\s@<>]@[^\s@<>]+\.[^\s@<>]")

          # The characters a text may use: printable ASCII with tabs and line
          # ends, and symbols that draw as no letter. Those Unicode's look-alike
          # table (UTS #39 confusables.txt) files under ASCII are also read as
          # it (AS_ASCII).
          ACCEPTED = [(0x20, 0x7E), (0xA7, 0xA7), (0xA9, 0xA9), (0xAE, 0xAE), (0xB0, 0xB0), (0xB7, 0xB7),
                      (0xD7, 0xD7), (0x2013, 0x2014), (0x2018, 0x2019), (0x201C, 0x201D), (0x2022, 0x2022),
                      (0x2026, 0x2026), (0x2122, 0x2122), (0x2190, 0x21FF), (0x2248, 0x2248), (0x2260, 0x2260),
                      (0x2264, 0x2265), (0x23E9, 0x23FA), (0x2500, 0x257F), (0x25A0, 0x25FF), (0x2600, 0x27BF),
                      (0x1F300, 0x1F64F), (0x1F680, 0x1F6FF), (0x1F7E0, 0x1F7EB), (0x1F900, 0x1F9FF),
                      (0x1FA70, 0x1FAFF)]
          # Emoji joiners and the emoji presentation selector: accepted, and
          # dropped when reading, since they draw nothing between letters.
          JOINERS = {0x200D: None, 0xFE0F: None}
          AS_ASCII = {0xD7: "x", 0x2013: "-", 0x2018: "'", 0x2019: "'", 0x201C: "''", 0x201D: "''",
                      0x2026: "...", 0x2571: "/", 0x2573: "X", 0x2768: "(", 0x2769: ")", 0x276E: "<",
                      0x276F: ">", 0x2772: "(", 0x2773: ")", 0x2774: "{", 0x2775: "}", 0x2795: "+",
                      0x2796: "-"}
          # GitHub's shortcodes for the robot and for emoji drawn as letters.
          SHORTCODES = {":robot:": "\U0001F916", ":a:": "A", ":b:": "B", ":o:": "O", ":o2:": "O",
                        ":m:": "M", ":x:": "X", ":heavy_multiplication_x:": "x", ":ab:": "AB",
                        ":cl:": "CL", ":cool:": "COOL", ":free:": "FREE", ":id:": "ID", ":new:": "NEW",
                        ":ng:": "NG", ":ok:": "OK", ":parking:": "P", ":sos:": "SOS", ":up:": "UP",
                        ":vs:": "VS", ":tm:": "TM", ":information_source:": "i"}

          def foreign(text):
              """The first character outside the accepted ones, if any."""
              for c in text:
                  code = ord(c)
                  if c not in "\t\n\r" and code not in JOINERS and not any(a <= code <= b for a, b in ACCEPTED):
                      return c
              return None

          def unmarked(text, marks="*_~`\\[]"):
              """Markdown and HTML as a reader sees them: comments gone, a link
              or image as its text, an HTML image as its alt text, other tags
              and the marks given gone."""
              text = re.sub(r"<!--.*?(?:-->|$)", "", text, flags=re.S)
              text = re.sub(r"!?\[([^\]]*)\]\([^)]*\)", r"\1", text)
              text = re.sub(r"\]\[[^\]]*\]", "]", text)
              text = re.sub(r"<img\b[^>]*?\balt=\"([^\"]*)\"[^>]*>", r"\1", text, flags=re.I)
              text = re.sub(r"</?[A-Za-z][\w-]*(?:\s[^>]*)?/?>", "", text)
              return text.translate({ord(c): None for c in marks})

          def unstruck(text):
              """The text without struck-out words, which a reader skips."""
              text = re.sub(r"~~.*?~~", "", text, flags=re.S)
              return re.sub(r"<(del|s|strike)\b[^>]*>.*?</\1>", "", text, flags=re.S | re.I)

          def views(text, is_markdown):
              """The text as written, with its entities and its link addresses
              decoded, and without its markup (a title only loses its code
              spans), each with emoji joiners dropped and GitHub's shortcodes
              drawn."""
              decoded = html.unescape(text)
              forms = [text, decoded, urllib.parse.unquote(decoded)]
              if is_markdown:
                  forms += [unmarked(decoded), unmarked(decoded, "*~`\\[]"), unmarked(unstruck(decoded))]
              else:
                  forms.append(decoded.replace("`", ""))
              read = []
              for form in dict.fromkeys(forms):
                  form = form.translate(JOINERS).translate(AS_ASCII)
                  for code, drawn in SHORTCODES.items():
                      form = form.replace(code, drawn)
                  read.append(form)
              return list(dict.fromkeys(read))

          def twins(text):
              """The text through Unicode's ASCII look-alike pairs: I, 1 and |
              read as l and the other way round, 0 as O, and rn as m."""
              common = text.replace("0", "O").replace("rn", "m")
              return [common.translate(str.maketrans("I1|", "lll")),
                      common.translate(str.maketrans("l1|", "III"))]

          def unlisted(ident):
              """Whether a co-author is someone the list does not name, with
              angle brackets and spacing evened out."""
              even = lambda s: " ".join(re.sub("[<>]", " ", s).split())
              return even(ident) not in {even(known) for known in KNOWN}

          def masked(text):
              """The text with each listed co-author's identity, after the
              exact trailer key, read as a neutral placeholder: the list
              judges people, never their names (a listed "Ai Tanaka" passes)."""
              return TRAILER.sub(lambda m: m.group(1) + ("a listed contributor" if m.group(2) in KNOWN
                                                         else m.group(2)), text)

          hits = []
          texts = [("the PR title", os.environ.get("PR_TITLE", ""), False),
                   ("the PR body", os.environ.get("PR_BODY", ""), True)]
          # The merge commit's message, whole: its title names the head as
          # "owner/branch" (for a fork, the owner is the contributor's
          # login), and the PR title follows it.
          head = os.environ.get("HEAD_LABEL", "").replace(":", "/", 1)
          texts.append(("the merge commit's message",
                        f"Merge pull request #{os.environ.get('PR_NUMBER', '')} from {head}\n\n"
                        f"{os.environ.get('PR_TITLE', '')}", False))
          # Each commit the PR adds: what its base already holds is not its own.
          messages = []
          for sha in git("rev-list", f"{os.environ['BASE_SHA']}..{os.environ['HEAD_SHA']}").decode().split():
              author, committer, message = read_commit(sha)
              people = [("author", author), ("committer", committer)]
              people += [("co-author", ident) for ident in CO_AUTHOR.findall(message)]
              for role, ident in people:
                  if ident.strip() not in KNOWN:
                      hits.append(f"commit {sha[:7]}'s {role} '{ident}' is not listed in "
                                  ".github/attribution-identities.txt")
              texts.append((f"commit {sha[:7]}'s message", message, False))
              messages.append(message)
          # A squash merge joins the messages into one, oldest first, each as
          # a "* " bullet; rev-list lists them newest first.
          if len(messages) > 1:
              texts.append(("the commit messages joined",
                            "\n\n".join("* " + message for message in reversed(messages)), False))

          for where, text, is_markdown in texts:
              text = masked(text)
              odd = foreign(text) or foreign(html.unescape(text))
              if odd:
                  hits.append(f"{where} uses '{odd}' (U+{ord(odd):04X}), outside the characters this "
                              "repository accepts (English text, common punctuation, arrows, box lines "
                              "and emoji)")
                  continue
              if is_markdown and DIRECTION.search(text):
                  hits.append(f"{where} sets a text direction by hand in HTML, which can reorder it")
                  continue
              read = views(text, is_markdown)
              # The title and body become merge messages, so a co-author line
              # in them faces the list too; only one with an email address
              # credits an account.
              if where.startswith("the PR "):
                  for ident in sorted({ident for view in read for ident in CO_AUTHOR.findall(view)
                                       if EMAIL.search(ident) and unlisted(ident)}):
                      hits.append(f"{where}'s co-author '{ident}' is not listed in "
                                  ".github/attribution-identities.txt")
              for view in read + [twin for view in read for twin in twins(view)]:
                  hit = hook.ATTRIBUTION.search(view) or hook.ATTRIBUTION.search(hook.strip_paths(view))
                  if hit:
                      hits.append(f"AI attribution in {where}: '{hit.group(0).strip()}'")
                      break
          for line in hits:
              print(f"::error::{line}")
          if hits:
              print("Commits, PRs, issues, comments and releases belong to the maintainer: remove the "
                    "attribution or the unaccepted characters (reword the commits, edit the title or "
                    "body) and push again. A new contributor's own identity is added to "
                    ".github/attribution-identities.txt by the maintainer, once they have read the "
                    "pull request.")
              sys.exit(1)
          print(f"No AI attribution in {len(texts)} texts.")
          EOF
